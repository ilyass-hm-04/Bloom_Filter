name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Unit tests
        run: mvn -B test

      - name: Run experiment (benchmark)
        run: java -cp target/classes com.example.mlops.Experiment experiments/experiment-config.properties

      - name: Keep metrics as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/